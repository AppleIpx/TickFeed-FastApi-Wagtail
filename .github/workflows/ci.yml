name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install backend dependencies
        run: uv sync --all-packages
      - name: Run prek
        run: uv run prek run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.test.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reset any leftover test containers
        run: docker compose down -v --remove-orphans
      - name: Build test containers
        run: docker compose build
      - name: Start postgres
        run: docker compose up -d --wait postgres
      - name: Show container status
        run: docker compose ps
      - name: Migrate DB
        run: docker compose run --rm fastapi alembic upgrade head
      - name: Run pytest
        run: docker compose run --rm fastapi bash scripts/tests-start.sh
      - name: Tear down containers
        if: always()
        run: docker compose down -v --remove-orphans
