[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "alembic>=1.19.1,<2",
  "fastapi[standard]>=0.141.1,<1",
  "httpx<1,>=0.25.1",
  "psycopg[binary]>=3.3.6,<4",
  "pydantic>=2.13.5",
  "pydantic-settings<3,>=2.2.1",
  "sqlmodel>=0.0.46,<1",
]

[dependency-groups]
dev = [
  "coverage<8,>=7.4.3",
  "mypy<3,>=1.8",
  "pytest<10,>=7.4.3",
  "ruff<1,>=0.16",
  "ty>=0.0.25",
]

[tool.ruff]
target-version = "py314"
exclude = [ "alembic" ]
lint.select = [
  "A",
  "ARG001", # unused arguments in functions
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FAST",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "B008",   # do not perform function calls in argument defaults (FastAPI Depends/Query)
  "B904",   # Allow raising exceptions without from e, for HTTPException
  "E501",   # line too long, handled by ruff format
  "G004",   # Logging statement uses f-string
  "RUF001", # String contains ambiguous unicode character (Cyrillic)
  "RUF002", # Docstring contains ambiguous unicode character (Cyrillic)
  "RUF003", # Comment contains ambiguous unicode character (Cyrillic)
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected
  "SIM102", # sometimes it's better to nest
  # FastAPI and Pydantic evaluate parameter/field annotations at runtime,
  # moving those imports under TYPE_CHECKING breaks the app
  "TC001",
  "TC002",
  "TC003",
  "W191",   # indentation contains tabs
]
lint.per-file-ignores."tests/**" = [
  "PLR2004", # Magic values: HTTP status codes in asserts
]
# Preserve types, even if a file imports `from __future__ import annotations`.
lint.pyupgrade.keep-runtime-typing = true

[tool.mypy]
exclude = [ ".venv", "alembic", "venv" ]
strict = true

[tool.ty]
terminal.error-on-warning = true

[tool.coverage]
run.source = [ "app" ]
run.dynamic_context = "test_function"
report.show_missing = true
report.sort = "-Cover"
html.show_contexts = true

[tool.fastapi]
entrypoint = "app.main:app"
