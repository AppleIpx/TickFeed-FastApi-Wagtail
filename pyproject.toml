[dependency-groups]
dev = [
  "prek>=0.5.3,<1",
  "pyproject-fmt>=2.28",
  "zizmor>=1.30.1",
]

[tool.uv]
workspace.members = [ "backend" ]

[tool.typos]
files.extend-exclude = [
  "uv.lock",
  "backend/coverage/",
  "backend/htmlcov/",
]
default.extend-ignore-re = [
  # GitHub usernames in @mentions
  "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
]
default.extend-identifiers.alls = "alls"
